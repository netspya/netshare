<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sala de Compartilhamento</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --fg:#e8eaed; --mut:#9aa0a6; --acc:#5b8def; --ok:#3ecf8e; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  button, input, select { font:inherit; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; }
  button.sec { background:#343942; }
  button.bad { background:var(--bad); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input, select { background:#14161a; color:var(--fg); border:1px solid #343942; border-radius:8px; padding:10px; }
  select { padding:8px; }
  .hidden { display:none !important; }
  .mut { color:var(--mut); font-size:.85rem; }

  #gh { position:fixed; top:12px; right:12px; z-index:10; width:40px; height:40px; display:grid; place-items:center; border-radius:50%; background:var(--card); color:var(--fg); border:1px solid #343942; transition:transform .15s, background .15s, color .15s; }
  #gh:hover { background:var(--fg); color:var(--bg); transform:scale(1.08); }

  #join { max-width:420px; margin:10vh auto; background:var(--card); padding:24px; border-radius:14px; display:grid; gap:12px; }
  #join h1 { margin:0; font-size:1.4rem; }
  #join label { display:grid; gap:4px; font-size:.9rem; }
  #joinErr { margin:0; color:#ff8a80; font-size:.9rem; font-weight:600; }

  /* A sala ocupa exatamente a janela: nada de rolagem, as telas se ajustam ao espaço */
  #room { height:100vh; height:100dvh; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) 230px; grid-template-rows:auto minmax(0,1fr) auto; gap:10px; padding:10px; }
  header { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding-right:52px; }
  header h2 { margin:0; font-size:1.05rem; }
  #grid { display:grid; gap:8px; min-height:0; min-width:0; overflow:hidden; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
  .tile { position:relative; background:#000; border-radius:12px; overflow:hidden; min-height:0; min-width:0; }
  .tile video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .note { position:absolute; inset:0; display:grid; place-items:center; color:var(--mut); font-size:.9rem; text-align:center; padding:12px; white-space:pre-line; }
  .unmute { position:absolute; right:8px; bottom:8px; padding:6px 10px; font-size:.8rem; border-radius:8px; }
  .label { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.65); color:#fff; padding:4px 10px; border-radius:8px; font-size:.8rem; font-weight:600; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #empty { color:var(--mut); display:grid; place-items:center; border:2px dashed #343942; border-radius:12px; }
  aside { background:var(--card); border-radius:12px; padding:12px; overflow:auto; min-height:0; }
  aside h3 { margin:0 0 8px; font-size:.95rem; }
  #people { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  #people li { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; background:#14161a; border-radius:8px; font-size:.9rem; }
  .badge { color:var(--ok); font-size:.8rem; white-space:nowrap; }
  #controls { grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--card); padding:8px 10px; border-radius:12px; }
  #controls .sp { flex:1; }
  #msg { color:#f0b429; font-size:.85rem; }
  @media (max-width:800px) {
    #room { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto; }
    aside { max-height:120px; }
  }
</style>
</head>
<body>

<a id="gh" href="https://github.com/netspya" target="_blank" rel="noopener" title="github.com/netspya" aria-label="GitHub de netspya">
  <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
  </svg>
</a>

<section id="join">
  <h1>Sala de Compartilhamento</h1>
  <p class="mut">Entre com seu nome e o nome de uma sala. Quem digitar o mesmo nome de sala entra junto com você.</p>
  <label>Seu nome <input id="inName" maxlength="24" placeholder="Ex.: Ana" autocomplete="off"></label>
  <label>Nome da sala <input id="inRoom" maxlength="32" placeholder="Ex.: galera-do-jogo" autocomplete="off"></label>
  <label>Senha da sala (opcional) <input id="inPass" type="password" maxlength="64" autocomplete="off" placeholder="Deixe vazio para sala aberta"></label>
  <p id="joinErr"></p>
  <button id="btnJoin">Entrar na sala</button>
  <p class="mut">Quem cria a sala define a senha. Quem entrar depois precisa digitar a mesma senha.</p>
</section>

<section id="room" class="hidden">
  <header>
    <h2>Sala: <span id="roomName"></span></h2>
    <span id="msg"></span>
    <button id="btnLink" class="sec">Copiar link da sala</button>
  </header>

  <div id="grid">
    <div id="empty">Ninguém está compartilhando ainda</div>
  </div>

  <aside>
    <h3>Participantes (<span id="count">1</span>)</h3>
    <ul id="people"></ul>
  </aside>

  <div id="controls">
    <button id="btnScreen">Compartilhar tela</button>
    <button id="btnCam" class="sec">Ligar câmera</button>
    <button id="btnStop" class="bad" disabled>Parar</button>
    <label class="mut">Fluidez:
      <select id="fps">
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
        <option value="120">120 FPS</option>
        <option value="144">144 FPS</option>
        <option value="240">240 FPS</option>
      </select>
    </label>
    <label class="mut">Resolução:
      <select id="res">
        <option value="720" selected>720p (leve)</option>
        <option value="1080">1080p (Full HD)</option>
        <option value="1440">1440p (2K)</option>
        <option value="2160">2160p (4K)</option>
      </select>
    </label>
    <span class="sp"></span>
    <button id="btnLeave" class="sec">Sair da sala</button>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);

/* ---------- Carregamento sob demanda do PeerJS (só quando você entra numa sala) ---------- */
let peerLoad = null;
function loadPeer() {
  if (window.Peer) return Promise.resolve(true);
  if (peerLoad) return peerLoad;
  peerLoad = new Promise(resolve => {
    const urls = [
      'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
    ];
    let i = 0;
    const next = () => {
      if (window.Peer) return resolve(true);
      if (i >= urls.length) { peerLoad = null; return resolve(false); }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => (window.Peer ? resolve(true) : next());
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
  return peerLoad;
}
// Começa a baixar assim que a pessoa clica em qualquer campo (ganha tempo sem gastar à toa)
$('join').addEventListener('focusin', () => loadPeer(), { once: true });

let peer = null;          // sua conexão com o servidor de encontro (id = sala + número da vaga)
let myName, baseId, roomPass = '', leaving = false;
let myId = null, mySlot = -1, joinedAt = 0, probeTimer = 0, searchTimer = 0;
let myStream = null, myKind = null;
const MAX_SLOTS = 12;      // máximo de pessoas por sala
const conns = new Map();        // id -> DataConnection escolhida
const dialing = new Map();      // id -> DataConnection ainda abrindo
const calls = new Map();        // id -> MediaConnection (saída)
const pendingCalls = new Map(); // id -> chamada recebida aguardando validação
const people = new Map();       // id -> {name, sharing, kind}
const tiles = new Map();        // id -> tile

const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sala';
const msg = t => { $('msg').textContent = t || ''; };
const msgText = () => $('msg').textContent || '';
const slotOf = id => { const m = /_(\d+)$/.exec(id || ''); return m ? +m[1] : 999; };
const norm = s => String(s || '').trim().toLowerCase();
const myAge = () => performance.now() - joinedAt;

/* ---------- Entrada na sala ---------- */
async function hashPass(room, pass) {
  if (!pass) return '';
  const data = new TextEncoder().encode(room + '|' + pass);
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381;
  for (const c of data) h = ((h * 33) ^ c) >>> 0;
  return 'h' + h.toString(16);
}

$('inRoom').value = decodeURIComponent(location.hash.slice(1) || '');
['inName', 'inRoom', 'inPass'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); }));

$('btnJoin').onclick = async () => {
  const name = $('inName').value.trim();
  const room = $('inRoom').value.trim();
  $('joinErr').textContent = '';
  if (!name || !room) { $('joinErr').textContent = 'Preencha seu nome e o nome da sala.'; return; }
  $('btnJoin').disabled = true;
  const ok = await loadPeer();
  if (!ok) {
    $('btnJoin').disabled = false;
    $('joinErr').textContent = 'Não foi possível carregar a biblioteca de conexão. Verifique sua internet ou bloqueadores de anúncio e tente de novo.';
    return;
  }
  const rs = slug(room);
  myName = name;
  baseId = 'ss2-' + rs;
  roomPass = await hashPass(rs, $('inPass').value);
  $('btnJoin').disabled = false;
  $('roomName').textContent = room;
  $('join').classList.add('hidden');
  $('room').classList.remove('hidden');
  start();
};

function destroyTile(t) {
  clearInterval(t.timer);
  try { t.video.srcObject = null; } catch (e) {}
  t.el.remove();
}
function resetState() {
  conns.clear(); dialing.clear(); calls.clear(); pendingCalls.clear(); people.clear();
  tiles.forEach(destroyTile); tiles.clear();
}
function closeAll() {
  clearInterval(probeTimer); clearTimeout(searchTimer);
  const p = peer; peer = null; myId = null; mySlot = -1;
  try { p && p.destroy(); } catch (e) {}
}

/* ---------- Encontrar a sala ----------
   Cada pessoa ocupa uma "vaga" fixa da sala (ss2-nome_0, _1, _2...).
   Para achar os outros, basta chamar todas as vagas: não existe "dono" da sala,
   então duas pessoas nunca acabam em salas separadas. */
function start() {
  closeAll(); resetState();
  leaving = false;
  joinedAt = performance.now();
  claimSlot(0);
}

function claimSlot(i) {
  if (leaving) return;
  if (i >= MAX_SLOTS) { kickOut('full'); return; }
  let opened = false;
  const me = new Peer(baseId + '_' + i);
  peer = me;

  me.on('open', id => {
    if (me !== peer) return;
    opened = true;
    myId = id; mySlot = i;
    msg('Procurando a sala...');
    probe();
    probeTimer = setInterval(probe, 12000);
    searchTimer = setTimeout(() => {
      if (!people.size && msgText().startsWith('Procurando')) msg('Sala criada. Aguardando outras pessoas...');
    }, 5000);
    render();
  });
  me.on('connection', c => { if (me === peer) setupConn(c, false); });
  me.on('call', call => { if (me === peer) onCall(call); });

  me.on('error', e => {
    if (me !== peer) return;
    if (e.type === 'unavailable-id') {
      try { me.destroy(); } catch (_) {}
      if (!opened) claimSlot(i + 1);
      else { msg('Reconectando à sala...'); setTimeout(() => { if (!leaving) start(); }, 500); }
      return;
    }
    if (e.type === 'peer-unavailable') {
      const m = /peer (\S+)$/.exec(String(e.message || ''));
      if (m) { const c = dialing.get(m[1]); dialing.delete(m[1]); if (c) { try { c.close(); } catch (_) {} } }
      return;
    }
    if (!opened && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
      msg('Servidor de conexão indisponível. Tentando de novo...');
      try { me.destroy(); } catch (_) {}
      setTimeout(() => claimSlot(i), 3000);
      return;
    }
    msg('Erro de conexão: ' + e.type);
  });
  me.on('disconnected', () => { if (me === peer && !me.destroyed && !leaving) { try { me.reconnect(); } catch (e) {} } });
}

function probe() {
  if (leaving || !peer || !peer.open || mySlot < 0) return;
  for (let i = 0; i < MAX_SLOTS; i++) if (i !== mySlot) dial(baseId + '_' + i);
}

function dial(id) {
  if (!id || !peer || !peer.open || id === myId || conns.has(id) || dialing.has(id)) return;
  const c = peer.connect(id, { reliable: true });
  dialing.set(id, c);
  setupConn(c, true);
  setTimeout(() => {
    if (dialing.get(id) === c) {
      dialing.delete(id);
      try { c.close(); } catch (e) {}
      msg('Não foi possível conectar com um participante (a rede dele pode estar restritiva).');
    }
  }, 20000);
}

/* ---------- Conexões entre participantes ---------- */
function sendHello(c) {
  c.sentAge = myAge();
  c.send({ t: 'hello', name: myName, sharing: !!myStream, kind: myKind, age: c.sentAge, pass: roomPass, slot: mySlot });
}

function setupConn(c, outbound) {
  const id = c.peer;
  c.on('open', () => {
    if (dialing.get(id) === c) dialing.delete(id);
    // Se duas conexões abrirem ao mesmo tempo, as duas pontas ficam com a mesma:
    // a iniciada pela pessoa de vaga maior.
    const dialerSlot = outbound ? mySlot : slotOf(id);
    const otherSlot = outbound ? slotOf(id) : mySlot;
    c.rank = dialerSlot > otherSlot;
    const old = conns.get(id);
    if (old && old !== c && old.open) {
      if (old.rank && !c.rank) { c.replaced = true; try { c.close(); } catch (e) {} return; }
      old.replaced = true; try { old.close(); } catch (e) {}
    }
    conns.set(id, c);
    sendHello(c);
  });
  c.on('data', d => {
    if (!d || c.replaced) return;
    if (d.t === 'hello') return onHello(c, d);
    if (d.t === 'denied') { if (!c.verified) kickOut(d.reason); return; }
    if (!c.verified) return;
    if (d.t === 'sharing') {
      const p = people.get(id);
      if (p) { p.sharing = d.on; p.kind = d.kind; render(); }
    }
  });
  const gone = () => {
    if (dialing.get(id) === c) dialing.delete(id);
    if (c.replaced) return;
    if (conns.get(id) === c) drop(id);
  };
  c.on('close', gone);
  c.on('error', gone);
}

// Valida senha e nome de quem acabou de conectar. Em caso de conflito vale a pessoa
// que está na sala há mais tempo; a outra é recusada.
function onHello(c, d) {
  const theirPass = d.pass || '';
  let reason = null;
  if (theirPass !== roomPass) reason = !roomPass ? 'required' : !theirPass ? 'open' : 'wrong';
  else if (norm(d.name) === norm(myName)) reason = 'name';

  if (reason) {
    const mine = c.sentAge != null ? c.sentAge : myAge();
    const theirs = +d.age || 0;
    const theyAreOlder = theirs > mine || (theirs === mine && slotOf(c.peer) < mySlot);
    if (theyAreOlder) { kickOut(reason); }
    else {
      try { c.send({ t: 'denied', reason }); } catch (e) {}
      setTimeout(() => { try { c.close(); } catch (e) {} }, 500);
    }
    return;
  }

  c.verified = true;
  people.set(c.peer, { name: d.name, sharing: !!d.sharing, kind: d.kind });
  const m = msgText();
  if (m.startsWith('Procurando') || m.startsWith('Sala ') || m.startsWith('Conectando')) msg('');
  const pc = pendingCalls.get(c.peer);
  if (pc) { pendingCalls.delete(c.peer); answerCall(pc); }
  if (myStream) callPeer(c.peer);
  render();
}

function kickOut(reason) {
  const text = reason === 'name' ? 'Já existe alguém com esse nome nesta sala. Escolha outro nome (ou aguarde alguns segundos se você acabou de recarregar a página).'
    : reason === 'required' ? 'Esta sala exige senha. Digite a senha para entrar.'
    : reason === 'open' ? 'Esta sala não usa senha. Deixe o campo de senha vazio.'
    : reason === 'full' ? 'Esta sala está cheia (máximo de ' + MAX_SLOTS + ' pessoas).'
    : 'Senha incorreta.';
  leaveRoom();
  $('joinErr').textContent = text;
}

function broadcast(m) { conns.forEach(c => { if (c.verified) { try { c.send(m); } catch (e) {} } }); }
function drop(id) {
  conns.delete(id); people.delete(id); pendingCalls.delete(id);
  const c = calls.get(id); if (c) c.close(); calls.delete(id);
  removeTile(id); render();
}

/* ---------- Receber vídeo (só de quem já foi validado) ---------- */
function onCall(call) {
  const c = conns.get(call.peer);
  if (c && c.verified) { answerCall(call); return; }
  pendingCalls.set(call.peer, call);
  setTimeout(() => {
    if (pendingCalls.get(call.peer) === call) { pendingCalls.delete(call.peer); try { call.close(); } catch (e) {} }
  }, 10000);
}
function answerCall(call) {
  call.answer(undefined, { sdpTransform: tuneSdp });
  call.on('stream', s => showTile(call.peer, s, call));
  call.on('close', () => { const t = tiles.get(call.peer); if (t && t.call === call) removeTile(call.peer); });
}

/* ---------- Qualidade de vídeo ---------- */
const DIMS = { 720: [1280, 720], 1080: [1920, 1080], 1440: [2560, 1440], 2160: [3840, 2160] };
function qualitySettings() {
  const fps = +$('fps').value;
  const res = +$('res').value;
  const [w, h] = DIMS[res] || DIMS[720];
  // bits por pixel diminuem quando o FPS sobe (quadros vizinhos são muito parecidos)
  const bpp = fps <= 30 ? 0.07 : fps <= 60 ? 0.06 : 0.035;
  const base = Math.min(40e6, Math.max(1.5e6, w * h * fps * bpp));
  return { fps, res, w, h, base };
}

// Faz o codificador começar já em boa qualidade (sem a fase "borrada" inicial).
function tuneSdp(sdp) {
  try {
    const lines = sdp.split('\r\n');
    const pts = new Set(), withFmtp = new Set();
    lines.forEach(l => {
      let m = l.match(/^a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\//);
      if (m) pts.add(m[1]);
      m = l.match(/^a=fmtp:(\d+) /);
      if (m) withFmtp.add(m[1]);
    });
    const extra = 'x-google-start-bitrate=2500;x-google-min-bitrate=600;x-google-max-bitrate=40000';
    const out = [];
    lines.forEach(l => {
      let m = l.match(/^a=fmtp:(\d+) (.*)$/);
      if (m && pts.has(m[1]) && !l.includes('x-google-')) { out.push(l + ';' + extra); return; }
      out.push(l);
      m = l.match(/^a=rtpmap:(\d+) /);
      if (m && pts.has(m[1]) && !withFmtp.has(m[1])) out.push('a=fmtp:' + m[1] + ' ' + extra);
    });
    return out.join('\r\n');
  } catch (e) { return sdp; }
}

function applyQuality() {
  if (!myStream) return;
  const q = qualitySettings();
  const n = Math.max(1, calls.size);
  // a sua internet é dividida entre quem está assistindo
  const per = Math.round(Math.max(1.2e6, Math.min(q.base, q.base * 1.6 / n)));
  calls.forEach(c => {
    const pc = c.peerConnection; if (!pc) return;
    pc.getSenders().forEach(s => {
      if (!s.track || s.track.kind !== 'video') return;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      const e = p.encodings[0];
      e.maxBitrate = per;
      e.maxFramerate = q.fps;
      const w = (s.track.getSettings && s.track.getSettings().width) || q.w;
      e.scaleResolutionDownBy = Math.max(1, w / q.w);
      p.degradationPreference = (myKind === 'screen' && q.fps <= 30) ? 'maintain-resolution'
        : (q.fps >= 60 ? 'maintain-framerate' : 'balanced');
      s.setParameters(p).catch(() => {});
    });
  });
}
let qTimers = [];
function scheduleQuality() {
  qTimers.forEach(clearTimeout);
  qTimers = [setTimeout(applyQuality, 1500), setTimeout(applyQuality, 4500)];
}

/* ---------- Transmissão ---------- */
function syncCapture() {
  if (!myStream) return;
  updateLocalNote();
}
function updateLocalNote() {
  const t = tiles.get('me');
  if (!t || !t.note || !myStream) return;
  const vt = myStream.getVideoTracks()[0]; if (!vt) return;
  const s = vt.getSettings ? vt.getSettings() : {};
  const info = (s.width || '?') + '×' + (s.height || '?') + ' a ' + Math.round(s.frameRate || 0) + ' FPS';
  t.note.textContent = calls.size > 0
    ? 'Sua tela está sendo transmitida para ' + calls.size + (calls.size === 1 ? ' pessoa' : ' pessoas') + '\n' + info
    : 'Sua tela está pronta, ninguém assistindo ainda\n' + info;
}

function callPeer(id) {
  if (!myStream || !peer || calls.has(id)) return;
  const c = peer.call(id, myStream, { sdpTransform: tuneSdp });
  calls.set(id, c);
  c.on('close', () => {
    if (calls.get(id) === c) { calls.delete(id); syncCapture(); scheduleQuality(); }
  });
  syncCapture();
  scheduleQuality();
}

async function share(kind) {
  if (myStream) stopShare();
  const q = qualitySettings();
  const frameRate = { ideal: q.fps, max: q.fps };
  try {
    if (kind === 'screen') {
      myStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate, width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h } },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } else {
      const video = { frameRate, width: { ideal: q.w }, height: { ideal: q.h } };
      try { myStream = await navigator.mediaDevices.getUserMedia({ video, audio: true }); }
      catch (e) { myStream = await navigator.mediaDevices.getUserMedia({ video }); }
    }
  } catch (e) { msg('Não foi possível iniciar: ' + e.message); return; }
  msg('');
  myKind = kind;
  const vt = myStream.getVideoTracks()[0];
  vt.contentHint = kind === 'screen' ? (q.fps >= 60 ? 'motion' : 'detail') : 'motion';
  vt.onended = () => stopShare();
  showTile('me', myStream, null, true);
  conns.forEach((c, id) => { if (c.verified) callPeer(id); });
  broadcast({ t: 'sharing', on: true, kind });
  syncCapture();
  updateButtons(); render();
}

function stopShare() {
  if (!myStream) return;
  const s = myStream;
  myStream = null; myKind = null;
  s.getTracks().forEach(t => { t.onended = null; t.stop(); });
  const list = [...calls.values()]; calls.clear(); list.forEach(c => c.close());
  removeTile('me');
  broadcast({ t: 'sharing', on: false });
  updateButtons(); render();
}

let warnTimer;
async function qualityChanged() {
  const q = qualitySettings();
  if (q.res >= 1440 || q.fps > 60) {
    msg('Qualidade alta: exige computador e internet (envio) fortes. Se travar, reduza.');
    clearTimeout(warnTimer); warnTimer = setTimeout(() => msg(''), 7000);
  }
  if (!myStream) return;
  const vt = myStream.getVideoTracks()[0];
  try {
    await vt.applyConstraints({
      frameRate: { ideal: q.fps, max: q.fps },
      width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h }
    });
  } catch (e) {}
  vt.contentHint = myKind === 'screen' ? (q.fps >= 60 ? 'motion' : 'detail') : 'motion';
  applyQuality();
  setTimeout(updateLocalNote, 800);
}
$('fps').onchange = qualityChanged;
$('res').onchange = qualityChanged;

$('btnLink').onclick = async () => {
  const link = location.href.split('#')[0] + '#' + encodeURIComponent($('roomName').textContent);
  try { await navigator.clipboard.writeText(link); msg('Link copiado!'); }
  catch (e) { prompt('Copie o link da sala:', link); }
  setTimeout(() => msg(''), 2500);
};
$('btnScreen').onclick = () => share('screen');
$('btnCam').onclick = () => share('cam');
$('btnStop').onclick = stopShare;

function leaveRoom() {
  stopShare();
  leaving = true;
  closeAll(); resetState();
  msg('');
  $('room').classList.add('hidden');
  $('join').classList.remove('hidden');
}
$('btnLeave').onclick = leaveRoom;
window.addEventListener('beforeunload', () => { leaving = true; closeAll(); });

function updateButtons() {
  $('btnStop').disabled = !myStream;
  $('btnScreen').textContent = myKind === 'screen' ? 'Reiniciar tela' : 'Compartilhar tela';
  $('btnCam').textContent = myKind === 'cam' ? 'Reiniciar câmera' : 'Ligar câmera';
}

/* ---------- Interface ---------- */
function showTile(id, stream, call, isLocal) {
  let t = tiles.get(id);
  if (!t) {
    const el = document.createElement('div'); el.className = 'tile';
    const video = document.createElement('video'); video.autoplay = true; video.playsInline = true;
    const label = document.createElement('div'); label.className = 'label';
    el.append(video);
    t = { el, video, label, call: null, note: null, um: null, noPreview: false, timer: 0, fps: 0, res: '', lastFrames: 0, lastT: 0, created: performance.now() };
    // Ver a própria tela dentro da própria tela gera um "espelho infinito" e pesa; mostramos um aviso.
    if (isLocal && myKind === 'screen') {
      t.noPreview = true;
      t.note = document.createElement('div'); t.note.className = 'note';
      el.append(t.note);
    }
    el.append(label);
    if (!isLocal) {
      // Aviso se a imagem demorar a aparecer (tela preta): clicar na tela força a reprodução
      t.note = document.createElement('div'); t.note.className = 'note hidden';
      t.note.style.pointerEvents = 'none';
      el.append(t.note);
      el.onclick = () => { t.video.play().catch(() => {}); };
    }
    if (!isLocal) {
      // Alguns navegadores (ex.: Brave) bloqueiam vídeo com som até um clique: oferecemos um botão
      t.um = document.createElement('button'); t.um.className = 'unmute hidden';
      t.um.textContent = 'Ativar som';
      t.um.onclick = () => { t.video.muted = false; t.video.play().catch(() => {}); t.um.classList.add('hidden'); };
      el.append(t.um);
    }
    el.ondblclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen(); };
    $('grid').append(el);
    tiles.set(id, t);
    // Medidor leve do que está chegando (a cada 2 s, só com a aba visível)
    if (!isLocal) {
      t.lastT = performance.now();
      t.timer = setInterval(() => {
        if (document.hidden) { t.lastT = performance.now(); return; }
        const v = t.video, q = v.getVideoPlaybackQuality && v.getVideoPlaybackQuality();
        const now = performance.now();
        if (q) { t.fps = Math.round((q.totalVideoFrames - t.lastFrames) * 1000 / (now - t.lastT)); t.lastFrames = q.totalVideoFrames; }
        t.lastT = now;
        t.res = v.videoWidth ? v.videoWidth + '×' + v.videoHeight : '';
        if (t.note) {
          const stuck = !v.videoWidth || v.paused;
          const waited = now - t.created > 4000;
          t.note.textContent = v.paused && v.videoWidth ? 'Vídeo pausado pelo navegador.\nClique aqui para reproduzir.'
            : 'Carregando a imagem...\nSe continuar preto, clique aqui.';
          t.note.classList.toggle('hidden', !(stuck && waited));
          if (v.paused && v.videoWidth) v.play().catch(() => {});
        }
        render();
      }, 2000);
    }
  }
  t.video.muted = !!isLocal;
  if (!t.noPreview && t.video.srcObject !== stream) t.video.srcObject = stream;
  t.call = call;
  if (!t.noPreview) {
    const pr = t.video.play();
    if (pr && pr.catch) pr.catch(() => {
      if (isLocal) return;
      // reprodução com som bloqueada: toca sem som para a imagem aparecer e oferece o botão
      t.video.muted = true;
      if (t.um) t.um.classList.remove('hidden');
      t.video.play().catch(() => {});
    });
  }
  render();
}
function removeTile(id) {
  const t = tiles.get(id);
  if (t) { destroyTile(t); tiles.delete(id); }
  render();
}

// Agrupa várias atualizações num único redesenho
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
window.addEventListener('resize', render);

function doRender() {
  const ul = $('people'); ul.textContent = '';
  const add = (name, sharing, kind, you) => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.textContent = name + (you ? ' (você)' : '');
    li.append(n);
    if (sharing) {
      const b = document.createElement('span'); b.className = 'badge';
      b.textContent = kind === 'cam' ? '● câmera' : '● tela';
      li.append(b);
    }
    ul.append(li);
  };
  add(myName || '', !!myStream, myKind, true);
  people.forEach(p => add(p.name, p.sharing, p.kind, false));
  $('count').textContent = people.size + 1;

  tiles.forEach((t, id) => {
    const name = id === 'me' ? myName + ' (você)' : (people.get(id) || {}).name || '...';
    const kind = id === 'me' ? myKind : (people.get(id) || {}).kind;
    let text = name + (kind === 'cam' ? ' — câmera' : ' — tela');
    if (id !== 'me') {
      if (t.res) text += ' · ' + t.res;
      if (t.fps) text += ' · ' + t.fps + ' fps';
      if (!t.res && performance.now() - t.created > 6000) text += ' · sem imagem';
    }
    if (t.label.textContent !== text) t.label.textContent = text;
  });

  // As telas dividem o espaço disponível sem estourar a janela
  const n = tiles.size;
  $('empty').classList.toggle('hidden', n > 0);
  let cols = 1, rows = 1;
  if (n > 0) {
    cols = window.matchMedia('(max-width:800px)').matches ? 1 : Math.ceil(Math.sqrt(n));
    rows = Math.ceil(n / cols);
  }
  $('grid').style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  $('grid').style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
}
</script>
